kind: 'Fixed'
body: 'fixed the output `terra` captures to decide whether a command needs `init --upgrade` being written by two goroutines at once, which could garble it: stdout and stderr were copied into one unguarded buffer. The test double the parallel state workers share now records its calls under a lock too, and CI runs the unit tests under the race detector so neither comes back unnoticed'
