name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  checks: 'write' # code_check-style_golangci_lint
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release

jobs:
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-binary.yaml@main'
    with:
      binary_name: 'terra'

  # The shared pipeline runs the tests without the race detector, which is how two
  # data races -- one in UpgradeAwareShellRepository's output capture, one in a test
  # double the parallel workers share -- went unnoticed. `go test` runs directly
  # because the pipeline's test scripts take no race option; the shared job still
  # owns coverage and the published reports.
  tests-race:
    name: 'tests > test:race'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      contents: 'read'
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: 'Run the tests with the race detector'
        run: 'go test -race -count=1 ./...'
