name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

# Read-only unless a job asks for more: write access is granted to the one job that
# needs it rather than inherited by every job the workflow gains.
permissions:
  contents: 'read'

jobs:
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-binary.yaml@main'
    permissions:
      checks: 'write' # code_check-style_golangci_lint
      security-events: 'write' # security-sast_codeql
      contents: 'write' # delivery-release
    with:
      binary_name: 'terra'
      # The shared pipeline runs the tests without the race detector, which is how two data races
      # -- one in UpgradeAwareShellRepository's output capture, one in a test double the parallel
      # workers share -- went unnoticed. The race run is an input of the pipeline rather than a
      # job of its own here, so it runs as `tests > test:race` in the tests stage, before delivery,
      # instead of starting at once beside the first stage. `test:all` still owns coverage and the
      # published reports.
      extra_test_name: 'race'
      extra_test_command: 'go test -race -count=1 ./...'
